camerax = "1.4.0"
media3 = "1.4.1"
room = "2.6.1"
work = "2.9.1"
datastore = "1.1.1"
securityCrypto = "1.1.0-alpha06"
okhttp = "4.12.0"
serializationJson = "1.7.3"
coroutines = "1.9.0"
coil = "2.7.0"
exifinterface = "1.3.7"
concurrentFutures = "1.2.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
